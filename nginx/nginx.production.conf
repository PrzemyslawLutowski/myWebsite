upstream mywebsite {
    server mywebsite_web_production:8000;
}

server {
    listen 80;
    server_name production;
    return 301 https://195.238.122.125:8011$request_uri;
}

server {
    server_name production;
    listen 443 ssl;

    ssl_certificate /certs/mywebsite_v1_staging-cert.crt;
    ssl_certificate_key /certs/mywebsite_v1_staging-cert.key;

    location / {
        proxy_pass http://mywebsite;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 100M;
    }

    location /static/ {
    alias /static/;
    }
}
