upstream mywebsite_v1 {
    server v1_web_staging:8000;
}

server {
    server_name 195.238.122.125;
    listen 80;
    return 301 https://195.238.122.125$request_uri;
}

server {
    server_name 195.238.122.125;
    listen 443 ssl;

    ssl_certificate /certs/mywebsite_v1_staging-cert.crt;
    ssl_certificate_key /certs/mywebsite_v1_staging-cert.key;

    location / {
        proxy_pass http://mywebsite_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        client_max_body_size 100M;
    }
}

