upstream mywebsite_v1 {
    server v1_web_staging:8000;
}

server {
    listen 80;
    server_name 195.238.122.125;

    location / {
        proxy_pass http://v1_web_staging:8000;
        proxy_set_header Host $host;  # <- to wysyła tylko nazwę hosta, bez portu
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }
}

